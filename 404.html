<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F5FA">
<meta name="color-scheme" content="light only">
<title>Page not found · Delty</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<style>
  /* Delty is light only, like the app. */
  @font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url(/assets/fonts/Inter-500-latin.woff2) format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:swap;src:url(/assets/fonts/Inter-700-latin.woff2) format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:800;font-display:swap;src:url(/assets/fonts/Inter-800-latin.woff2) format('woff2')}
  :root{color-scheme:light only;--ink:#171A2C;--dim:#5B6478;--ease:cubic-bezier(.2,.7,.2,1);--grad:linear-gradient(90deg,#1AA690,#3D7BFF,#8B3BF5)}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;font-weight:500;line-height:1.6;-webkit-font-smoothing:antialiased;
    background:radial-gradient(620px 520px at -6% -8%,rgba(180,241,229,.75),transparent 70%),radial-gradient(700px 600px at 108% 6%,rgba(207,221,255,.85),transparent 70%),radial-gradient(560px 520px at 40% 108%,rgba(228,212,255,.55),transparent 70%),#F4F5FA;background-attachment:fixed}
  main{width:100%;max-width:520px;padding:44px 40px;border-radius:32px;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.8));
    box-shadow:0 1px 0 rgba(255,255,255,.95) inset,0 0 0 1px rgba(203,211,228,.62),0 40px 80px -40px rgba(16,26,56,.3),0 4px 10px -4px rgba(16,26,56,.05);animation:in .7s var(--ease) backwards}
  .logo{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:1.12rem;letter-spacing:-.02em;color:var(--ink);text-decoration:none;min-height:44px}
  .logo img{width:34px;height:34px;border-radius:10px;box-shadow:0 6px 16px rgba(61,123,255,.24)}
  .code{display:block;margin-top:26px;font-size:.76rem;font-weight:800;letter-spacing:.16em;color:#0F7A6A}
  h1{margin-top:10px;font-size:clamp(2rem,6vw,2.6rem);line-height:1.05;letter-spacing:-.04em;font-weight:800;text-wrap:balance}
  h1::after{content:"";display:block;width:44px;height:4px;border-radius:4px;background:var(--grad);margin-top:20px}
  p{margin-top:18px;color:var(--dim);font-size:1.06rem}
  nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
  nav a{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:14px;font-weight:700;font-size:1rem;text-decoration:none;color:var(--ink);background:#fff;
    box-shadow:0 0 0 1px rgba(203,211,228,.9),0 10px 20px -14px rgba(16,26,56,.3);transition:transform .2s var(--ease)}
  nav a.primary{color:#fff;background:linear-gradient(100deg,#0B8170,#2563EB 52%,#7C3AED);box-shadow:0 1px 0 rgba(255,255,255,.38) inset,0 14px 28px -10px rgba(37,99,235,.6)}
  nav a:hover{transform:translateY(-1px)}
  nav a:active{transform:scale(.98)}
  main>*{animation:in .6s var(--ease) backwards}
  main>:nth-child(2){animation-delay:.08s}main>:nth-child(3){animation-delay:.14s}main>:nth-child(4){animation-delay:.2s}main>:nth-child(5){animation-delay:.26s}
  :focus-visible{outline:3px solid rgba(61,123,255,.55);outline-offset:3px;border-radius:8px}
  ::selection{background:rgba(61,123,255,.2)}
  @keyframes in{from{opacity:0;transform:translateY(14px)}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  @media (max-width:480px){main{padding:32px 24px;border-radius:26px}nav a{flex:1 1 100%;justify-content:center}}
</style>
</head>
<body>
<main>
  <a class="logo" href="/"><img src="/assets/icon-180.png" width="34" height="34" alt="">Delty</a>
  <span class="code" aria-hidden="true">404</span>
  <h1>Page not found</h1>
  <p>That page isn't here. It may have moved, or the link may be mistyped.</p>
  <nav aria-label="Site">
    <a class="primary" href="/">Delty home</a>
    <a href="/support.html">Support</a>
    <a href="/privacy.html">Privacy</a>
  </nav>
</main>
</body>
</html>
